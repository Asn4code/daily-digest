[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "daily-digest"
version = "0.1.0"
description = "Informes con evidencias y revisión personal de proyectos científicos"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["httpx>=0.28,<1", "typer>=0.12,<1", "pydantic>=2.12,<3", "pyyaml>=6,<7", "pillow>=11,<14", "cairosvg>=2.7,<3", "pypdfium2>=4,<6", "jinja2>=3.1,<4", "markdown-it-py>=3,<5", "nh3>=0.3,<1", "weasyprint>=70,<71"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.6,<1", "mypy>=1.11,<2", "aiosmtpd>=1.4.6,<2"]

[project.scripts]
digest = "digest.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
digest = ["py.typed", "db/migrations/*.sql", "report/templates/*.html"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[[tool.mypy.overrides]]
module = "yaml"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["cairosvg.*", "pypdfium2.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["weasyprint.*"]
ignore_missing_imports = true
